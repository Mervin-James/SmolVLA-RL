policy:
  optimizer_lr: 1.0e-4
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-6
  path: lerobot/smolvla_base
  pretrained_revision: d9f33c94a60fb382c90dea2164c96845bd955e28
  empty_cameras: 1
  n_action_steps: 10
  push_to_hub: false
  device: cuda

dataset:
  repo_id: lerobot/libero
  revision: a1aaacb7f6cd6ee5fb43120f673cebb0cfea7dd4
  video_backend: torchcodec

rename_map:
  observation.images.image: observation.images.camera1
  observation.images.image2: observation.images.camera2

subsets: configs/subsets/libero_goal.json

train:
  batch_size: 32
  steps: 8000
  num_workers: 4
  save_freq: 2000
  log_freq: 50
